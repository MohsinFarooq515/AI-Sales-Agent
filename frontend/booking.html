<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a consultation</title><style>body{margin:0;background:#f4f7fb;color:#172235;font:16px system-ui}.card{max-width:620px;margin:6vh auto;background:white;border-radius:18px;padding:30px;box-shadow:0 14px 45px #1233}h1{margin-top:0}label{display:block;margin:15px 0 6px}input,textarea,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{margin-top:20px;background:#1767a3;color:white;border:0;cursor:pointer}.message{margin-top:15px}</style></head><body><main class="card"><h1>Book a Google Calendar consultation</h1><p>Choose a suitable time. Google Calendar will email the invitation and meeting details.</p><form><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Date and time</label><input name="start" type="datetime-local" required><label>Notes</label><textarea name="notes" rows="4"></textarea><button>Confirm booking</button></form><div class="message" aria-live="polite"></div></main><script>const params=new URLSearchParams(location.search),session=params.get('session')||localStorage.getItem('sits_agent_session'),form=document.querySelector('form'),message=document.querySelector('.message');form.onsubmit=async e=>{e.preventDefault();message.textContent='Booking…';const data=Object.fromEntries(new FormData(form));data.session_id=session;data.start=new Date(data.start).toISOString();data.timezone=Intl.DateTimeFormat().resolvedOptions().timeZone;try{const r=await fetch('/api/google-calendar/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),body=await r.json();if(!r.ok)throw Error(body.detail||'Booking failed');message.innerHTML=`Meeting booked. <a href="${body.calendar_url}" target="_blank" rel="noopener">Open Google Calendar</a>`;form.hidden=true}catch(err){message.textContent=err.message}}</script></body></html>
