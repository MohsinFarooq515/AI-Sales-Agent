<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meeting preparation details</title>
  <style>
    body{margin:0;background:#f4f7fb;color:#172235;font:16px system-ui}
    .card{max-width:760px;margin:4vh auto;background:white;border-radius:18px;padding:30px;box-shadow:0 14px 45px #1233}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    label{display:block;margin:12px 0 5px}
    input,select,textarea,button{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;box-sizing:border-box}
    button{margin-top:20px;background:#1767a3;color:white;border:0;cursor:pointer}
    .wide{grid-column:1/-1}.message{margin-top:15px}
    @media(max-width:600px){.grid{grid-template-columns:1fr}.card{margin:0;border-radius:0}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Help us prepare for your meeting</h1>
    <p>We have filled in everything already shared. Complete only the missing details so we can connect you with the best professional for your needs.</p>
    <form class="grid">
      <div><label>Full name</label><input name="full_name" required autocomplete="name"></div>
      <div><label>Contact number</label><input name="phone" required autocomplete="tel"></div>
      <div><label>Email</label><input name="email" type="email" required autocomplete="email"></div>
      <div><label>Which best describes you?</label><select name="persona" required><option value="">Select an option</option><option value="entrepreneur">Business owner / entrepreneur</option><option value="solopreneur">Independent professional / solopreneur</option><option value="company_representative">Company representative</option><option value="aspiring_entrepreneur">Planning a new business</option><option value="general_visitor">Something else</option></select></div>
      <div><label>Company or business name</label><input name="company_name"></div>
      <div><label>Industry</label><input name="industry"></div>
      <div><label>Website</label><input name="website_url" type="url"></div>
      <div><label>Location</label><input name="location"></div>
      <div><label>Preferred timeline</label><input name="timeline" placeholder="For example: This month"></div>
      <div><label>Budget range</label><input name="budget" placeholder="Optional"></div>
      <div class="wide"><label>Services you are interested in (comma-separated)</label><input name="required_services"></div>
      <div class="wide"><label>Actual requirement</label><textarea name="business_problem" rows="5" required placeholder="Describe the problem and the result you want"></textarea></div>
      <button class="wide">Submit details</button>
    </form>
    <div class="message" aria-live="polite"></div>
  </main>
  <script>
    const session=new URLSearchParams(location.search).get('session'),form=document.querySelector('form'),message=document.querySelector('.message');
    async function load(){
      if(!session){message.textContent='Start a chat before opening this form.';form.hidden=true;return}
      const response=await fetch('/api/inquiries/'+session);
      if(!response.ok){message.textContent='Saved details could not be loaded.';return}
      const data=await response.json();
      for(const [key,value] of Object.entries(data)){
        const field=form.elements[key];
        if(field&&value)field.value=Array.isArray(value)?value.join(', '):value;
      }
    }
    load();
    form.onsubmit=async event=>{
      event.preventDefault();message.textContent='Submitting…';
      const data=Object.fromEntries(new FormData(form));
      data.required_services=data.required_services.split(',').map(value=>value.trim()).filter(Boolean);
      for(const key of Object.keys(data))if(data[key]==='')data[key]=null;
      try{
        const response=await fetch('/api/inquiries/'+session,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),body=await response.json();
        if(!response.ok)throw Error(body.detail||'Submission failed');
        message.textContent='Thank you. Your details were submitted and added to the meeting.';
        form.hidden=true;
      }catch(error){message.textContent=error.message}
    };
  </script>
</body>
</html>
