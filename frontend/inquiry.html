<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a proposal</title><style>body{margin:0;background:#f4f7fb;color:#172235;font:16px system-ui}.card{max-width:720px;margin:4vh auto;background:white;border-radius:18px;padding:30px;box-shadow:0 14px 45px #1233}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin:12px 0 5px}input,textarea,button{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;box-sizing:border-box}button{margin-top:20px;background:#1767a3;color:white;border:0;cursor:pointer}.wide{grid-column:1/-1}.message{margin-top:15px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>Request a proposal</h1><p>Review the information collected by the AI assistant and complete anything missing.</p><form class="grid"><div><label>Full name</label><input name="full_name" required></div><div><label>Company</label><input name="company_name"></div><div><label>Email</label><input name="email" type="email" required></div><div><label>Phone</label><input name="phone"></div><div><label>Website</label><input name="website_url" type="url"></div><div><label>Industry</label><input name="industry"></div><div class="wide"><label>Required services (comma-separated)</label><input name="required_services"></div><div class="wide"><label>Business requirement</label><textarea name="business_problem" rows="5" required></textarea></div><button class="wide">Submit inquiry</button></form><div class="message" aria-live="polite"></div></main><script>const session=new URLSearchParams(location.search).get('session')||localStorage.getItem('sits_agent_session'),form=document.querySelector('form'),message=document.querySelector('.message');async function load(){if(!session){message.textContent='Start a chat before opening the inquiry form.';form.hidden=true;return}const r=await fetch('/api/inquiries/'+session);if(!r.ok)return;const data=await r.json();for(const [key,value] of Object.entries(data)){const input=form.elements[key];if(input&&value)input.value=Array.isArray(value)?value.join(', '):value}}load();form.onsubmit=async e=>{e.preventDefault();message.textContent='Submitting…';const data=Object.fromEntries(new FormData(form));data.required_services=data.required_services.split(',').map(x=>x.trim()).filter(Boolean);for(const key of Object.keys(data))if(data[key]==='')data[key]=null;try{const r=await fetch('/api/inquiries/'+session,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),body=await r.json();if(!r.ok)throw Error(body.detail||'Submission failed');message.textContent=`Inquiry submitted. Lead score: ${body.score} (${body.temperature}).`;form.hidden=true}catch(err){message.textContent=err.message}}</script></body></html>
